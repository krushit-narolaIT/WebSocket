<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
<div class="container mx-auto p-4 max-w-2xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">WebSocket Chat Application</h1>

        <div id="username-form" class="mb-6">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Enter your name:</label>
                <input type="text" id="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Your name">
            </div>
            <div class="text-center">
                <button id="connect" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Connect
                </button>
            </div>
        </div>

        <!-- Debug Panel -->
        <div id="debug-panel" class="mb-4 p-2 bg-gray-200 rounded text-xs">
            <p><strong>Debug Info:</strong></p>
            <div id="debug-log" class="max-h-20 overflow-y-auto"></div>
        </div>

        <!-- Chat Interface (Initially Hidden) -->
        <div id="chat-container" class="hidden">
            <div id="conversation" class="border rounded-md h-64 overflow-y-auto p-4 mb-4 bg-gray-50"></div>

            <form id="message-form" class="flex">
                <input type="text" id="message" class="shadow appearance-none border rounded-l w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Type your message...">
                <button id="send" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-r focus:outline-none focus:shadow-outline">
                    Send
                </button>
            </form>

            <div class="mt-4 text-center">
                <button id="disconnect" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Disconnect
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    let stompClient = null;
    let username = "";

    function debugLog(message) {
        const timestamp = new Date().toLocaleTimeString();
        $("#debug-log").append(`<p>[${timestamp}] ${message}</p>`);
        console.log(`[DEBUG] ${message}`);
    }

    function connect() {
        username = $("#username").val().trim();

        if (username === "") {
            alert("Please enter your name");
            return;
        }

        debugLog(`Attempting to connect with username: ${username}`);

        const socket = new SockJS('/chat-websocket');
        stompClient = Stomp.over(socket);

        // Enable debug info for STOMP
        stompClient.debug = function(str) {
            debugLog(`STOMP: ${str}`);
        };

        stompClient.connect({}, function(frame) {
            debugLog(`Connected: ${frame}`);

            // Subscribe to the message topic
            stompClient.subscribe('/topic/messages', function(response) {
                debugLog(`Received message: ${response.body}`);
                showMessage(JSON.parse(response.body));
            });

            // Hide username form and show chat interface
            $("#username-form").addClass("hidden");
            $("#chat-container").removeClass("hidden");

            // Add welcome message
            $("#conversation").append(`
                    <div class="p-2 text-center">
                        <span class="text-green-600 font-medium">Welcome to the chat, ${username}!</span>
                    </div>
                `);

            // Focus on the message input
            $("#message").focus();
        }, function(error) {
            // Connection error callback
            debugLog(`Connection error: ${error}`);
            alert("Failed to connect to WebSocket server. See debug panel for details.");
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            debugLog("Disconnecting...");
            stompClient.disconnect();
            stompClient = null;

            // Show username form and hide chat interface
            $("#username-form").removeClass("hidden");
            $("#chat-container").addClass("hidden");

            // Clear the conversation
            $("#conversation").html("");
            debugLog("Disconnected");
        }
    }

    function sendMessage() {
        const messageContent = $("#message").val().trim();

        if (messageContent && stompClient) {
            const chatMessage = {
                username: username,
                content: messageContent
            };

            debugLog(`Sending message: ${JSON.stringify(chatMessage)}`);
            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
            $("#message").val("");
        }
    }

    function showMessage(message) {
        debugLog(`Displaying message from ${message.username}: ${message.content}`);
        const isCurrentUser = message.username === username;
        const messageClass = isCurrentUser ?
            "bg-blue-100 text-blue-800 ml-auto" :
            "bg-gray-200 text-gray-800 mr-auto";

        $("#conversation").append(`
                <div class="flex flex-col mb-2 max-w-xs ${isCurrentUser ? 'items-end' : 'items-start'}">
                    <span class="text-xs text-gray-500">${message.username}</span>
                    <div class="${messageClass} rounded-lg py-2 px-4">
                        ${message.content}
                    </div>
                </div>
            `);

        // Scroll to the bottom of the conversation
        const conversation = document.getElementById("conversation");
        conversation.scrollTop = conversation.scrollHeight;
    }

    $(function() {
        debugLog("Application initialized");

        $("#connect").click(function() {
            connect();
        });

        $("#disconnect").click(function() {
            disconnect();
        });

        $("#message-form").on("submit", function(e) {
            e.preventDefault();
            sendMessage();
        });

        // Allow pressing Enter in the username field to connect
        $("#username").keypress(function(e) {
            if (e.which === 13) {
                connect();
                return false;
            }
        });
    });
</script>
</body>
</html>
